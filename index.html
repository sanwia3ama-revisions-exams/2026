<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ القنابل النووية 💣 للثانوية العامة</title>
    <style>
        :root {
            /* الألوان في الوضع الفاتح */
            --bg: #f0f2f5;
            --card: rgba(255, 255, 255, 0.8);
            --text: #2d3436;
            --accent: #ff4e00; /* لون الانفجار البرتقالي */
            --nuclear-yellow: #f1c40f; /* لون التحذير النووي */
            --shadow: rgba(0,0,0,0.1);
            --border: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            /* الألوان في الوضع الداكن */
            --bg: #0f0f0f;
            --card: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --shadow: rgba(255, 78, 0, 0.2);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            left: 20px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 5px 15px var(--shadow);
            z-index: 1000;
            transition: 0.3s;
        }

        header {
            margin: 60px 0 30px;
            text-align: center;
        }

        /* تنسيق العنوان الجديد */
        header h1 {
            font-size: 3.2rem;
            font-weight: 900; /* Bold عريض جداً */
            color: var(--accent); /* لون القنبلة */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header .sub-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text);
            display: block;
            margin-top: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            padding-bottom: 50px;
        }

        .bomb-card {
            background: var(--card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 10px 20px var(--shadow);
        }

        .bomb-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent));
            transition: 0.6s;
        }

        .bomb-card:hover::before { left: 100%; }

        .bomb-card::after {
            content: "انقر للاختراق ☢️";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
            transition: 0.3s;
        }

        .bomb-card:hover::after { bottom: 15px; }

        .bomb-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent);
            box-shadow: 0 15px 30px var(--shadow);
        }

        .bomb-card i {
            font-size: 4rem;
            display: block;
            margin-bottom: 15px;
            transition: 0.4s;
        }

        .bomb-card:hover i { transform: scale(1.25) rotate(8deg); }

        .bomb-card h2 {
            font-size: 1.6rem;
            margin: 10px 0;
            font-weight: bold;
        }

        /* ألوان المواد */
        .arabic { border-bottom: 6px solid #ff9f43; }
        .physics { border-bottom: 6px solid #3498db; }
        .chemistry { border-bottom: 6px solid #2ecc71; }
        .math { border-bottom: 6px solid #ee5253; }
        .history { border-bottom: 6px solid #f1c40f; }
        .geography { border-bottom: 6px solid #00d2d3; }

    </style>
</head>
<body>

    <button class="theme-switch" onclick="toggleTheme()">تغيير الوضع 🌙</button>

    <header>
        <h1>⚡ القنابل النووية 💣</h1>
        <span class="sub-title">للثانوية العامة</span>
    </header>

    <div class="grid-container">
        <div class="bomb-card arabic" onclick="fetchData('arabic', 'https://raw.githubusercontent.com/username/repo/main/arabic.json')">
            <i>📖</i>
            <h2>قنابل العربية</h2>
        </div>
        
        <div class="bomb-card physics" onclick="fetchData('physics', 'https://raw.githubusercontent.com/username/repo/main/physics.json')">
            <i>⚡</i>
            <h2>قنابل الفيزياء</h2>
        </div>

        <div class="bomb-card chemistry" onclick="fetchData('chemistry', 'https://raw.githubusercontent.com/username/repo/main/chemistry.json')">
            <i>🧪</i>
            <h2>قنابل الكيمياء</h2>
        </div>

        <div class="bomb-card math" onclick="fetchData('math', 'https://raw.githubusercontent.com/username/repo/main/math.json')">
            <i>📐</i>
            <h2>قنابل الرياضيات</h2>
        </div>

        <div class="bomb-card history" onclick="fetchData('history', 'https://raw.githubusercontent.com/username/repo/main/history.json')">
            <i>🏛️</i>
            <h2>قنابل التاريخ</h2>
        </div>

        <div class="bomb-card geography" onclick="fetchData('geography', 'https://raw.githubusercontent.com/username/repo/main/geography.json')">
            <i>🌍</i>
            <h2>قنابل الجغرافيا</h2>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-switch');
            const isDark = body.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                body.removeAttribute('data-theme');
                btn.innerText = 'تغيير الوضع 🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = 'تغيير الوضع ☀️';
            }
        }

        // دالة جلب البيانات من JSON عبر GitHub
        async function fetchData(subjectName, url) {
            console.log("جاري الاتصال بقاعدة بيانات: " + subjectName);
            
            try {
                // هنا يتم جلب ملف الـ JSON
                // ملحوظة: يجب استخدام رابط الـ Raw من GitHub ليعمل الكود
                const response = await fetch(url);
                if (!response.ok) throw new Error('فشل في جلب البيانات');
                
                const data = await response.json();
                
                // هنا تضعي منطق عرض السؤال والجواب (مثلاً في Modal أو صفحة جديدة)
                alert("تم بنجاح جلب " + data.questions.length + " سؤال في مادة " + subjectName);
                console.log(data);
                
            } catch (error) {
                // تم إخفاء رسالة التنبيه (Alert) عند حدوث خطأ أو عند استخدام روابط تجريبية وطباعتها في الـ Console فقط
                console.warn("جاري ربط ملف الـ JSON لمادة " + subjectName + ".. تأكد من وضع رابط الـ Raw الصحيح من GitHub.");
            }
        }
    </script>
</body>
</html>
